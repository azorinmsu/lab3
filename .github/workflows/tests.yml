name: tests

on:
  push:
  pull_request:

jobs:
  student:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: mvn -B test
      - run: python -m pip install -r python-tests/requirements.txt
      - run: python -m pytest python-tests -q
